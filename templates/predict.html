{% extends "base.html" %}
{% block title %}Previsão{% endblock %}

{% block content %}
<h1 class="mb-4">Previsão para Novo Cliente</h1>
<p>Preencha os dados do cliente para estimar a probabilidade de renovação.</p>

<form id="predictForm" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Idade</label>
        <input type="number" class="form-control" name="age" min="18" max="80" value="30" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Gênero</label>
        <select class="form-select" name="gender">
            <option value="Male">Masculino</option>
            <option value="Female">Feminino</option>
        </select>
    </div>

    <div class="col-md-6">
        <label class="form-label">Tempo de assinatura (meses)</label>
        <input type="number" class="form-control" name="subscription_length" min="1" max="120" value="12" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Tipo de plano</label>
        <select class="form-select" name="membership_type">
            <option value="Basic">Básico (1)</option>
            <option value="Standard">Standard (3)</option>
            <option value="Premium">Premium (6)</option>
        </select>
    </div>

    <div class="col-md-6">
        <label class="form-label">Número de logins no período</label>
        <input type="number" class="form-control" name="num_logins" min="0" max="500" value="50" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Número de reclamações</label>
        <input type="number" class="form-control" name="num_complaints" min="0" max="50" value="0" required>
    </div>

    <div class="col-md-6">
        <label class="form-label">Aulas frequentadas</label>
        <input type="number" class="form-control" name="num_classes_attended" min="0" max="500" value="10" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Tempo médio de sessão (min)</label>
        <input type="number" class="form-control" name="avg_session_time" min="0" max="300" value="60" required>
    </div>

    <div class="col-12 mt-3">
        <button type="submit" class="btn btn-primary btn-lg">Prever Renovação</button>
    </div>
</form>

<div id="result" class="mt-4"></div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById('predictForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const formData = new FormData(this);
    const result = document.getElementById('result');
    result.innerHTML = '<div class="alert alert-info">Calculando previsão...</div>';

    try {
        const response = await fetch('/predict', {
            method: 'POST',
            body: formData
        });

        // Se o servidor devolveu HTML (erro), isso detecta:
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
            throw new Error('Servidor não retornou JSON. Status: ' + response.status);
        }

        const data = await response.json();

        if (!data.success) {
            result.innerHTML = '<div class="alert alert-danger">Erro: ' + data.error + '</div>';
            return;
        }

        const proba = (data.probability * 100).toFixed(2);
        const isRenew = data.prediction === 1;
        const alertClass = isRenew ? 'success' : 'danger';

        result.innerHTML = `
            <div class="alert alert-${alertClass}">
                <h4 class="alert-heading">${isRenew ? '✅ Cliente com alta chance de renovar' : '❌ Cliente com baixa chance de renovar'}</h4>
                <p class="mb-0"><strong>Probabilidade de renovação:</strong> ${proba}%</p>
            </div>
            <div id="gaugeChart" style="min-height:320px;"></div>
        `;

        if (typeof Plotly !== 'undefined') {
            Plotly.newPlot('gaugeChart', [{
                type: 'indicator',
                mode: 'gauge+number',
                value: parseFloat(proba),
                title: { text: 'Probabilidade de Renovação (%)' },
                gauge: {
                    axis: { range: [0, 100] },
                    bar: { color: isRenew ? '#2ecc71' : '#e74c3c' },
                    steps: [
                        { range: [0, 50],   color: '#fadbd8' },
                        { range: [50, 100], color: '#d5f5e3' }
                    ]
                }
            }], { height: 320 });
        }

    } catch (err) {
        result.innerHTML = '<div class="alert alert-danger">Erro inesperado: ' + err.message + '</div>';
    }
});
</script>
{% endblock %}
