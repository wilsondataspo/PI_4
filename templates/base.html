<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gym Renewal ML{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly -->
    <!-- <script src="https://cdn.plot.ly/plotly-2.34.0.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.34.0/plotly.min.js"></script>
    <!-- CSS customizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">🏋️ Gym Renewal ML</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% if page=='index' %}active{% endif %}" href="{{ url_for('index') }}">Visão Geral</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page=='eda' %}active{% endif %}" href="{{ url_for('eda') }}">Análise Exploratória</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page=='models' %}active{% endif %}" href="{{ url_for('models_page') }}">Modelos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page=='predict' %}active{% endif %}" href="{{ url_for('predict_page') }}">Previsão</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-4">
    <small>Projeto de Machine Learning — Previsão de Renovação de Academia</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
